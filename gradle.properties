# =============================================================================
# Gradle Properties — Enterprise Build Optimization v2.0
# =============================================================================

# Gradle Daemon — ускоряет повторные сборки (кеш JVM)
org.gradle.daemon=true

# Параллельная сборка модулей
org.gradle.parallel=true

# Конфигурирование по требованию
org.gradle.configureondemand=true

# Configuration Cache — кеширует граф задач между сборками (Gradle 8.1+)
# Значительно ускоряет повторные сборки (до 50% быстрее)
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# JVM память для Gradle
# 8GB для основного процесса, ParallelGC для быстрого GC
org.gradle.jvmargs=-Xmx8192m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m

# Gradle Build Cache — кеширует результаты задач
org.gradle.caching=true

# Количество параллельных workers (по числу ядер)
org.gradle.workers.max=8

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.multiplatform=true
kotlin.daemon.jvmargs=-Xmx4096m
# Kotlin Compiler Daemon — переиспользование между сборками
kotlin.compiler.execution.strategy=daemon

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.defaults.buildfeatures.buildconfig=true

# Kapt (deprecated — используем KSP)
kapt.incremental.apt=true
kapt.use.worker.api=true

# KSP — быстрее чем kapt
ksp.incremental=true
ksp.incremental.log=false
